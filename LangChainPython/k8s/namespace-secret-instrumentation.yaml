# Shared Kubernetes manifests for the LangChain weather agents
#
# Apply this once per cluster to set up the namespace, the secret holding the
# Foundry API key + Application Insights `data-1` connection string, and the
# AKS App Monitoring Instrumentation CR.
#
# At api-version 2026-02-01 the Instrumentation CR's
# `settings.autoInstrumentationPlatforms` enum only accepts `Java` and `NodeJs`.
# The Python distro is in private preview and is enabled per workload by the
# `instrumentation.opentelemetry.io/private-preview-inject-python: "<cr-name>"`
# annotation on the deployment - see LangChainPython/k8s/deployment.yaml.
#
# Then `kubectl apply -f LangChainPython/k8s/deployment.yaml`
# and  `kubectl apply -f LangChainNodeJs/k8s/deployment.yaml`.

apiVersion: v1
kind: Namespace
metadata:
  name: langchain-agents
  labels:
    name: langchain-agents
---
apiVersion: v1
kind: Secret
metadata:
  name: foundry-secrets
  namespace: langchain-agents
type: Opaque
stringData:
  # Replace with your own value when redeploying. The Application Insights
  # connection string is configured separately on the Instrumentation CR
  # below; the agents themselves do not use APPLICATIONINSIGHTS_CONNECTION_STRING
  # in code (auto-instrumentation handles export).
  AZURE_OPENAI_API_KEY: "REPLACE_WITH_AZURE_OPENAI_API_KEY"
---
apiVersion: monitor.azure.com/v1
kind: Instrumentation
metadata:
  # The CR named `default` is applied to every workload in the namespace whose
  # podspec carries an `instrumentation.opentelemetry.io/inject-<lang>=true`
  # annotation.
  name: default
  namespace: langchain-agents
spec:
  destination:
    applicationInsightsConnectionString: "REPLACE_WITH_DATA_1_CONNECTION_STRING"
  settings:
    autoInstrumentationPlatforms:
      - NodeJs
